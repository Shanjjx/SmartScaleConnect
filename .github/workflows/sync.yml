name: Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect getWeights logic
        run: |
          docker run --rm --entrypoint /bin/sh alexxit/smartscaleconnect:latest -c '
            apk add --no-cache binutils 2>/dev/null || apt-get update && apt-get install -y binutils 2>/dev/null || true
            objdump -d $(which scaleconnect) | grep -A 45 "<github.com/AlexxIT/SmartScaleConnect/internal.getWeights>:" | head -n 45 || true
          '
