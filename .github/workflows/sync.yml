name: Sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Run sync
        env:
          GARMIN_LOGIN: ${{ secrets.GARMIN_LOGIN }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          FITBIT_LOGIN: ${{ secrets.FITBIT_LOGIN }}
          FITBIT_PASSWORD: ${{ secrets.FITBIT_PASSWORD }}
        run: |
          mkdir -p config
          python3 -c '
          import os, yaml
          cfg = {
              "garmin": {
                  "login": os.environ["GARMIN_LOGIN"],
                  "password": os.environ["GARMIN_PASSWORD"]
              },
              "fitbit": {
                  "login": os.environ["FITBIT_LOGIN"],
                  "password": os.environ["FITBIT_PASSWORD"]
              }
          }
          with open("config/scaleconnect.yaml", "w") as f:
              yaml.dump(cfg, f, default_flow_style=False)
          '
          echo "Konfiguration erfolgreich und valide erstellt."
          
          docker run --rm \
            -v $(pwd)/config:/config \
            alexxit/smartscaleconnect:latest \
            scaleconnect -c /config/scaleconnect.yaml
