name: Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Extract weights logic from binary
        run: |
          docker run --rm --entrypoint /bin/sh alexxit/smartscaleconnect:latest -c '
            echo "=== STRINGS UM WEIGHTS.GO ==="
            strings $(which scaleconnect) | grep -C 5 "weights.go" | head -n 40
            echo "=== TRENNZEICHEN / SCHLÜSSEL IN INTERNAL ==="
            strings $(which scaleconnect) | grep -E "(fitbit|garmin)[^a-zA-Z0-9]" | head -n 30 || true
          '
