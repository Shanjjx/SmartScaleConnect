YAML
name: Sync Fitbit to Garmin

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Run SmartScaleConnect
        env:
          GARMIN_LOGIN: ${{ secrets.GARMIN_LOGIN }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          FITBIT_LOGIN: ${{ secrets.FITBIT_LOGIN }}
          FITBIT_PASSWORD: ${{ secrets.FITBIT_PASSWORD }}
        run: |
          docker run --rm \
            -e "GARMIN_LOGIN=$GARMIN_LOGIN" \
            -e "GARMIN_PASSWORD=$GARMIN_PASSWORD" \
            -e "FITBIT_LOGIN=$FITBIT_LOGIN" \
            -e "FITBIT_PASSWORD=$FITBIT_PASSWORD" \
            alexxit/smartscaleconnect:latest
