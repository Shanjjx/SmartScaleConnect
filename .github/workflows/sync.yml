name: Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect container structure
        run: |
          docker run --rm --entrypoint sh alexxit/smartscaleconnect:latest -c "
            echo '--- Root Verzeichnis ---'
            ls -la /
            echo '--- Suche nach Programmdateien ---'
            which smartscaleconnect || which scaleconnect || find / -maxdepth 3 -name '*scale*' 2>/dev/null
