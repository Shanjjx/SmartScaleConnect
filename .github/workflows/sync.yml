name: Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect binary internals
        run: |
          docker run --rm alexxit/smartscaleconnect:latest sh -c '
            echo "=== FITBIT & GARMIN OFFSETS ==="
            strings -t x /bin/scaleconnect | grep -iE "fitbit|garmin|weights\.go" | head -n 40
            
            echo "=== SCHEMA & FORMAT STRINGS ==="
            strings /bin/scaleconnect | grep -E "%s.*%s" | head -n 30
