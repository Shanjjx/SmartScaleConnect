name: Sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Run sync
        env:
          GARMIN_LOGIN: ${{ secrets.GARMIN_LOGIN }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          FITBIT_LOGIN: ${{ secrets.FITBIT_LOGIN }}
          FITBIT_PASSWORD: ${{ secrets.FITBIT_PASSWORD }}
        run: |
          cat <<EOF > config.yaml
          garmin:
            login: "$GARMIN_LOGIN"
            password: "$GARMIN_PASSWORD"
          fitbit:
            login: "$FITBIT_LOGIN"
            password: "$FITBIT_PASSWORD"
          EOF

          timeout 120s docker run --rm \
            -v $(pwd)/config.yaml:/app/config.yaml \
            alexxit/smartscaleconnect:latest || code=$?; if [ $code -eq 124 ] || [ $code -eq 0 ]; then exit 0; else exit $code; fi
