name: Sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Run sync
        env:
          GARMIN_LOGIN: ${{ secrets.GARMIN_LOGIN }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          FITBIT_LOGIN: ${{ secrets.FITBIT_LOGIN }}
          FITBIT_PASSWORD: ${{ secrets.FITBIT_PASSWORD }}
        run: |
          mkdir -p config
          cat <<EOF > config/scaleconnect.yaml
          garmin:
            login: "$GARMIN_LOGIN"
            password: "$GARMIN_PASSWORD"
          fitbit:
            login: "$FITBIT_LOGIN"
            password: "$FITBIT_PASSWORD"
          EOF

          docker run --rm \
            -v $(pwd)/config:/config \
            alexxit/smartscaleconnect:latest \
            scaleconnect -c /config/scaleconnect.yaml
