name: Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect container
        run: |
          echo "=== HELP / ENTRYPOINT ==="
          docker run --rm alexxit/smartscaleconnect:latest --help || true

          echo "=== DATEIEN IM IMAGE ==="
          docker run --rm alexxit/smartscaleconnect:latest ls -la /app || true

          echo "=== PYTHON ENTRYPOINT DATEI ==="
          docker run --rm alexxit/smartscaleconnect:latest cat /app/main.py 2>/dev/null || docker run --rm alexxit/smartscaleconnect:latest cat /app/app.py 2>/dev/null || true
