name: Sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Run sync
        env:
          GARMIN_LOGIN: ${{ secrets.GARMIN_LOGIN }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          FITBIT_LOGIN: ${{ secrets.FITBIT_LOGIN }}
          FITBIT_PASSWORD: ${{ secrets.FITBIT_PASSWORD }}
        run: |
          mkdir -p data
          cat <<EOF > data/config.yaml
          log:
            level: debug
          garmin:
            login: "$GARMIN_LOGIN"
            password: "$GARMIN_PASSWORD"
          fitbit:
            login: "$FITBIT_LOGIN"
            password: "$FITBIT_PASSWORD"
          EOF

          echo "Starte scaleconnect..."
          docker run --rm -t \
            -e PYTHONUNBUFFERED=1 \
            -v $(pwd)/data:/data \
            alexxit/smartscaleconnect:latest &
          
          CONTAINER_PID=$!
          sleep 40
          kill $CONTAINER_PID 2>/dev/null || true

          echo "--- In data erstellte Dateien ---"
          ls -la data/
