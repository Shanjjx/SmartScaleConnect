name: Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect YAML structure in binary
        run: |
          docker run --rm --entrypoint /bin/sh alexxit/smartscaleconnect:latest -c '
            echo "=== YAML TAGS ==="
            strings $(which scaleconnect) | grep -E "yaml:\"" | head -n 40
            echo "=== BEISPIEL KONFIGURATION IM BINARY ==="
            strings $(which scaleconnect) | grep -A 10 -B 2 "garmin:" | head -n 30 || true
          '
