name: Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect account parsing
        run: |
          docker run --rm --entrypoint /bin/sh alexxit/smartscaleconnect:latest -c '
            strings $(which scaleconnect) | grep -A 5 -B 5 "unsupported type" || true
            strings $(which scaleconnect) | grep -C 3 "GetAccount" || true
          '
