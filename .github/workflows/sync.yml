name: Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Dump Go types and structs
        run: |
          docker run --rm --entrypoint /bin/sh alexxit/smartscaleconnect:latest -c '
            echo "=== STRUCT TYPES IN BINARY ==="
            strings $(which scaleconnect) | grep -E "type:\.eq\.main\." || true
            strings $(which scaleconnect) | grep -E "type:\.eq\.internal\." || true
            echo "=== HELP TEXT OF SCALECONNECT ==="
            scaleconnect -h || true
          '
