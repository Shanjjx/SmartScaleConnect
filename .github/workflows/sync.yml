name: Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check binary strings and test run
        env:
          GARMIN_LOGIN: ${{ secrets.GARMIN_LOGIN }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          FITBIT_LOGIN: ${{ secrets.FITBIT_LOGIN }}
          FITBIT_PASSWORD: ${{ secrets.FITBIT_PASSWORD }}
        run: |
          mkdir -p config
          cat <<EOF > config/scaleconnect.yaml
          garmin:
            login: "$GARMIN_LOGIN"
            password: "$GARMIN_PASSWORD"
          fitbit:
            login: "$FITBIT_LOGIN"
            password: "$FITBIT_PASSWORD"
          EOF

          echo "=== CONFIG-TEST ==="
          cat config/scaleconnect.yaml | sed 's/password:.*/password: ***/'

          echo "=== AUSFÜHRUNG MIT VERBOSE / DEBUG ==="
          docker run --rm -v $(pwd)/config:/config alexxit/smartscaleconnect:latest scaleconnect -c /config/scaleconnect.yaml -r 1s || true

          echo "=== SCHLÜSSELWÖRTER IM BINARY ==="
          docker run --rm --entrypoint /bin/sh alexxit/smartscaleconnect:latest -c 'strings $(which scaleconnect) | grep -iE "fitbit|garmin|config" | head -n 30'
