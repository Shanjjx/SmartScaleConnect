name: Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Copy binary and inspect
        run: |
          docker create --name temp-container alexxit/smartscaleconnect:latest
          docker cp temp-container:/bin/scaleconnect ./scaleconnect
          docker rm temp-container

          echo "=== FITBIT & GARMIN VORKOMMNISSE ==="
          strings -t x ./scaleconnect | grep -iE "fitbit|garmin|weights\.go" | head -n 40

          echo "=== CONFIG / FORMAT STRINGS ==="
          strings ./scaleconnect | grep -E "%s.*%s" | head -n 30
